<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HOMEHUB Login</title>
    <link rel="stylesheet" href="/css/core/variables.css" />
    <link rel="stylesheet" href="/css/core/base.css" />
    <link rel="stylesheet" href="/css/components/buttons.css" />
    <link rel="stylesheet" href="/pages/auth/login.css" />
  </head>
  <body>
    <div class="login-page">
      <div class="login-card">
        <div class="login-logo">H</div>
        <h1>HOMEHUB</h1>
        <p class="subtitle">Sign in to your home</p>
        <form id="loginForm">
          <label for="email">Email</label>
          <input id="email" type="email" autocomplete="username" required />
          <label for="password">Password</label>
          <input id="password" type="password" autocomplete="current-password" required />
          <button class="hh-button full" type="submit">Sign In</button>
        </form>
        <div id="errorMessage"></div>
      </div>
    </div>
    <script type="module" src="/js/pages/login-page.js"></script>
  </body>
</html>
