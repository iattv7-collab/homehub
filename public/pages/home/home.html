<!-- public/pages/home/home.html -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HOMEHUB</title>
    <link rel="stylesheet" href="/css/core/variables.css" />
    <link rel="stylesheet" href="/css/core/base.css" />
    <link rel="stylesheet" href="/css/layout/shell.css" />
    <link rel="stylesheet" href="/css/layout/sidebar.css" />
    <link rel="stylesheet" href="/css/layout/header.css" />
    <link rel="stylesheet" href="/css/components/buttons.css" />
    <link rel="stylesheet" href="/css/components/cards.css" />
    <link rel="stylesheet" href="/css/pages/home.css" />
  </head>

  <body>
    <div class="hh-shell">
      <aside class="hh-sidebar">
        <div class="hh-brand">
          <div class="hh-logo">H</div>
          <h2 class="hh-brand-title">HOMEHUB</h2>
          <p class="hh-brand-subtitle">Home</p>
        </div>

        <nav class="hh-nav">
          <a class="hh-nav-link active" href="/pages/home/home.html">Home</a>
          <button class="hh-nav-link hh-nav-button" id="sign-out" type="button">Sign out</button>
        </nav>

        <div class="hh-sidebar-footer">
          <div class="hh-user-card">
            <strong id="user-name">Signed in</strong>
            <span>Home</span>
          </div>
        </div>
      </aside>

      <main class="hh-main">
        <div class="hh-page hh-home">
          <header class="hh-topbar">
            <div class="hh-greeting">
              <h1 id="greeting-title">Welcome back</h1>
              <p id="greeting-sub">Loading your home…</p>
              <span class="hh-status-pill" id="user-status">Signing in…</span>
            </div>

            <div class="hh-weather">
              <div class="hh-weather-icon" id="weather-icon">—</div>
              <div>
                <div class="hh-weather-temp" id="weather-temp">—</div>
                <div class="hh-weather-label" id="weather-label">Miramar, Florida</div>
              </div>
            </div>
          </header>

          <section>
            <div class="hh-section-title">
              <h2>Quick Access</h2>
            </div>

            <div class="hh-app-grid">
              <div class="hh-card hh-app-card">
                <div class="hh-app-icon">📷</div>
                <div>
                  <h3>Camera</h3>
                  <p>Opens Google Home.</p>
                </div>
                <button class="hh-button" type="button" data-launch="google-camera">Open cameras</button>
              </div>

              <div class="hh-card hh-app-card">
                <div class="hh-app-icon">🚪</div>
                <div>
                  <h3>Front Door</h3>
                  <p>Opens Philips Home Access.</p>
                </div>
                <button class="hh-button" type="button" data-launch="philips-door">Open lock</button>
              </div>

              <div class="hh-card hh-app-card">
                <div class="hh-app-icon">🚗</div>
                <div>
                  <h3>Garage</h3>
                  <p>Opens myQ.</p>
                </div>
                <button class="hh-button" type="button" data-launch="myq-garage">Open garage</button>
              </div>

              <div class="hh-card hh-app-card">
                <div class="hh-app-icon">🧺</div>
                <div>
                  <h3>Appliances</h3>
                  <p>Opens SmartThings.</p>
                </div>
                <button class="hh-button" type="button" data-launch="smartthings-appliances">Open appliances</button>
              </div>

              <div class="hh-card hh-app-card">
                <div class="hh-app-icon">🌡️</div>
                <div>
                  <h3>Thermostat</h3>
                  <p>Opens Google Home.</p>
                </div>
                <button class="hh-button" type="button" data-launch="google-thermostat">Open thermostat</button>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <nav class="hh-mobile-nav">
      <a class="active" href="/pages/home/home.html"><span>🏠</span>Home</a>
      <button id="sign-out-mobile" type="button"><span>🚪</span>Sign out</button>
    </nav>

    <script type="module" src="/js/core/app.js"></script>
  </body>
</html>
